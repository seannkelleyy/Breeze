services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: breeze-woodpecker-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - breeze-woodpecker-data:/var/lib/woodpecker
    env_file:
      - .env.woodpecker
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=http://localhost:8000
      - WOODPECKER_GITHUB=true

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: breeze-woodpecker-agent
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.woodpecker
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000

volumes:
  breeze-woodpecker-data:
