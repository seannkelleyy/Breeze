name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: breeze
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: breeze.api
    env:
      DATABASE_URL: postgres://postgres:breeze@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: breeze.api/go.mod
          cache-dependency-path: breeze.api/go.sum
      - uses: ariga/setup-atlas@v0
      - name: Apply migrations (schema for integration tests)
        run: atlas migrate apply --dir file://db/migrations --url "$DATABASE_URL"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: breeze.api
          version: v2.14.0
      - name: Test
        run: go test ./... -count=1

  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breeze.web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breeze.web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_YXB0LW1vbmtmaXNoLTcxLmNsZXJrLmFjY291bnRzLmRldiQ
