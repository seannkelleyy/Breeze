name: breeze-api-ci

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "breeze.api/**"
      - ".github/workflows/master_breeze-api.yml"
  pull_request:
    paths:
      - "breeze.api/**"
      - ".github/workflows/master_breeze-api.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breeze.api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: breeze.api/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Build API binary
        run: go build -o bin/api ./cmd/api/...

      - name: Build River runner
        run: go build -o bin/river ./cmd/river/...
