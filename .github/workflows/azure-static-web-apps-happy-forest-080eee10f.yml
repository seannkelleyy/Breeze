name: breeze-web-ci

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "breeze.web/**"
      - "breeze.api/graph/schema.graphqls"
      - ".github/workflows/azure-static-web-apps-happy-forest-080eee10f.yml"
  pull_request:
    paths:
      - "breeze.web/**"
      - "breeze.api/graph/schema.graphqls"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breeze.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breeze.web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate GraphQL types from API schema
        run: npm run gen

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
