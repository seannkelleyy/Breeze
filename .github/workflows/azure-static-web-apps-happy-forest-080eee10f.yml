name: breeze-web-ci

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "breeze.web/**"
      - ".github/workflows/azure-static-web-apps-happy-forest-080eee10f.yml"
  pull_request:
    paths:
      - "breeze.web/**"
      - ".github/workflows/azure-static-web-apps-happy-forest-080eee10f.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breeze.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breeze.web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run build
        run: npm run build
